description = """ClipVault Pro is a powerful, all-in-one NVDA global plugin designed to boost productivity and secure sensitive data. It seamlessly combines advanced clipboard history management, rapid list collection from active windows, a custom favorites snippet saver, and a secure local password manager. With intuitive keyboard shortcuts and built-in accessibility features, ClipVault Pro makes managing text snippets, organizing lists, and protecting credentials effortless for screen reader users."""
